{% extends "base.html" %}
{% block title %}Enter reset code · Amber Home Automation{% endblock %}
{% block content %}

<div class="mx-auto flex min-h-[70vh] w-full max-w-md flex-col justify-center py-10">
  <div class="mb-8 text-center">
    <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-accent-soft text-2xl text-accent">✉</span>
    <h1 class="font-display mt-5 text-3xl font-semibold tracking-tight text-stone-900">Enter your code</h1>
    {% if notice %}
    <p class="mt-2 text-sm leading-6 text-stone-500">{{ notice }}</p>
    {% endif %}
  </div>

  <div class="card p-7 sm:p-8">
    {% if error %}
    <div class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm leading-6 text-red-700">
      {{ error }}
    </div>
    {% endif %}
    <form method="post" action="/reset/verify" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token | default('') }}">
      <input type="hidden" name="email" value="{{ email or '' }}">
      <div>
        <label class="field-label" for="code">6-digit code</label>
        <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required
               placeholder="••••••" class="field-input text-center font-mono text-lg tracking-[0.4em]">
      </div>
      <div>
        <label class="field-label" for="password">New password</label>
        <input id="password" name="password" type="password" minlength="10" required autocomplete="new-password"
               class="field-input">
        <span class="field-help">At least 10 characters.</span>
      </div>
      <button type="submit"
              class="mt-2 w-full rounded-xl bg-accent px-6 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-accent-strong active:scale-[.99]">
        Set new password
      </button>
    </form>
  </div>

  <p class="mt-6 text-center text-xs leading-6 text-stone-400">
    Didn't get it? <a class="font-medium text-accent hover:underline" href="/reset">Request a new code</a>.
  </p>
</div>

{% endblock %}
